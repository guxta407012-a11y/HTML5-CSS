<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        div.container {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.filho {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;

        }

        div#cxa {
            flex-shrink: 2;
            flex-grow: 0;
        }

        div#cxb {
            flex-shrink: 1;
            flex-grow: 2;
        }

        div#cxc {
           flex-shrink: 2;
           flex-grow: 0; 
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="filho" id="cxa">A</div>
        <div class="filho" id="cxb">B</div>
        <div class="filho" id="cxc">C</div>
    </div>
</body>
</html>
