<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 530px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            border: 1px solid black;
            padding: 10px;
        }

        .cor {
            background-color: grey;
            color: white;
        }

        .meio {
            text-align: left;
            background-color: grey;
            color: white;
        }

        .nu {
            background-color: grey;
            color: white;
        }

    </style>

</head>
<body>
    <h1>Exercicio de tabelas</h1>

    <table>
        <thead class="cor">
            <th scope="col">Área</th>
            <th scope="col">Disciplina</th>
            <th>Notas 1</th>
            <th>notas 2</th>
            <th scope="col">Média</th>
        </thead>

        <tbody>
            <th scope="rowgroup" rowspan="4">Exatas</th>
            <td>Matematica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>

            <tr>
            <td>Fisica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            </tr>

            <tr>
            <td>Quimica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            </tr>

            <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            </tr>

            <th colspan="4" scope="row" class="meio">Media de Exatas</th>

            <td class="nu">0.0</td>

            <tr>
                <th scope="rowgroup" rowspan="2">Humanas</th>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th scope="row" colspan="4" class="meio">Mèdia de humanas</th>
                <td class="nu">0.0</td>
            </tr>

        </tbody>

    </table>

</body>
</html>
