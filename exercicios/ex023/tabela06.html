<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 530px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

    </style>

</head>
<body>
    <table>
        <thead>
            <tr>
                <th>
                    grupo
                </th>

                <th>nomes</th>

                <th colspan="3">filmes</th>
                
            </tr>
        </thead>
        <tbody>
            <section id="mulheres">
                <tr>
                    <th rowspan="3">mulheres</th>
                    <td>Ana Maria Santos</td>
                    <td>Alien</td>
                    <td>Rambo</td>
                    <td>Vingadores</td>
                </tr>
                <tr>
                    <td>Beatriz Souza</td>
                    <td>Hulk</td>
                    <td>Inception</td>
                    <td>Batman</td>
                </tr>

                <tr>
                    <td>Cláudia Meio</td>
                    <td>oblivion</td>
                    <td>Matrix</td>
                    <td>Big hero</td>
                </tr>

            </section>

            <section id="Homens">
                <tr>
                    <th rowspan="3">homens</th>
                    <td>Bruno Mendonça</td>
                </tr>
                <tr>
                    <td>Daniel Lourenço</td>
                </tr>
                <tr>
                    <td>Fabiano Mota</td>
                </tr>
            </section>

        </tbody>
    </table>
</body>
</html>
