<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cordel</title>
    <style>
        header {
            background-color: black;
            padding: 80px;
            text-align: center;
        }

        header > h1 {
            color: white;
            margin: 0px;
            font-size: 5em;
        }

        header > p {
            color: white;
            margin: 0px;
            margin-top: 13px;
        }

        span {
            color: rgba(255, 255, 255, 0.568);
        }

        main {
            margin-top: 70px;
        }

        main > p {
            line-height: 70px;
            margin-top: 10px;
            margin-left: 25px;
            font-size: 45px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Cordel Moderno</h1>
        <p><span>por</span> Milton Duarte</p>
    </header>

    <main>
        <p>Estou ficando cansado <br>Da tal tecnologia</p>
    </main>
</body>
</html>
